{% extends 'base.html' %}

{% block content %}
<h2 class="text-center text-primary mb-4 fw-bold">Healthcare Services Offered</h2>

<div class="row g-4">
    {% for service in services %}
    <div class="col-md-6">
        <div class="card h-100 border-0 shadow-sm p-3">
            <div class="card-body">
                <h4 class="card-title text-dark fw-bold">{{ service.title }}</h4>
                <p class="card-text text-secondary mt-2">{{ service.desc }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
