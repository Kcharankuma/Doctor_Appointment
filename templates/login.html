{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-sm border-top border-4"
            style="border-top-color: var(--primary-teal) !important;">
            <div class="text-center mb-4">
                <div
                    class="bg-custom-teal text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2"
                    style="width: 60px; height: 60px; fs-3;">
                    🩺
                </div>
                <h3 class="fw-bold text-dark">Doctor Portal</h3>
                <p class="text-muted small">Access patient appointments and
                    schedules</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div
                class="alert alert-{{ category }} p-2 small text-center mb-3">{{
                message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username</label>
                    <input type="text" name="username" class="form-control"
                        placeholder="Enter doctor username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" name="password" class="form-control"
                        placeholder="Enter password" required>
                </div>
                <button type="submit"
                    class="btn btn-custom-teal w-100 py-2 fw-bold">Login to
                    Dashboard</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
