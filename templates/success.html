{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-4 shadow-sm">
            <div class="text-success fs-1 mb-2">✅</div>
            <h3 class="fw-bold text-dark mb-2">Appointment Booked!</h3>
            <p class="text-muted small">Your appointment request has been sent successfully.</p>
            
            <div class="bg-light p-3 rounded-3 text-start mb-4">
                <p class="mb-1"><strong>Patient:</strong> {{ data.name }}</p>
                <p class="mb-1"><strong>Phone:</strong> {{ data.phone }}</p>
                <p class="mb-1"><strong>Date:</strong> {{ data.date }}</p>
                <p class="mb-1"><strong>Session:</strong> {{ data.time_slot }}</p>
            </div>

            <a href="/" class="btn btn-primary w-100 py-2 fw-bold mb-2">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
