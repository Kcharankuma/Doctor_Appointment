{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm p-4">
            <h2 class="text-center text-primary mb-4 fw-bold">Book a Clinic Appointment</h2>

            {% if error_msg %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                ⚠️ {{ error_msg }}
            </div>
            {% endif %}

            <form action="/appointment" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Patient Name</label>
                    <input type="text" name="name" class="form-control" required minlength="2" maxlength="50" placeholder="Enter patient's full name">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Mobile Phone Number</label>
                    <input type="tel" name="phone" class="form-control" required minlength="10" maxlength="10" placeholder="10-digit mobile number">
                </div>
                <!-- Patient Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="customer@example.com" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Preferred Date</label>
                        <input type="date" id="appointment_date" name="date" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Time Session</label>
                        <select name="time_slot" class="form-select" required>
                            <option value="Morning (9 AM - 1 PM)">Morning Session (9:00 AM - 1:00 PM)</option>
                            <option value="Evening (5 PM - 9 PM)">Evening Session (5:00 PM - 9:00 PM)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Reason for Visit / Symptoms</label>
                    <textarea name="reason" class="form-control" rows="3" required minlength="3" maxlength="200" placeholder="Describe symptoms (e.g., fever, cold, general BP checkup)"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Confirm Booking</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Set minimum date to today in client timezone
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const minDate = `${year}-${month}-${day}`;

    document.getElementById('appointment_date').setAttribute('min', minDate);
    document.getElementById('appointment_date').value = minDate;
</script>
{% endblock %}
